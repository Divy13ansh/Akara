[project]
name = "akara"
version = "0.1.0"
description = "Akara monorepo (voice + video + api)"
requires-python = ">=3.11"
dependencies = []

[tool.uv.workspace]
members = [
  "services/voice",
  "services/api",
  "services/video",
  "packages/akara_common",
  "packages/akara_rag",
]

[dependency-groups]
dev = ["pytest", "ruff", "httpx", "fastapi"]

[tool.ruff]
line-length = 100
