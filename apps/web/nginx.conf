# SPA + API proxy. Same-origin /api means zero CORS in composed mode (plan §3c).
# This is the ONLY publicly exposed service on EC2 (SG: 80/443 only).

# Resolve `api` at request time via Docker's embedded DNS (127.0.0.11) instead
# of caching its IP at startup — otherwise a recreated api container 502s.
resolver 127.0.0.11 valid=10s ipv6=off;

# Basic abuse throttling (per-IP). Auth/token endpoints are also rate-limited
# in the API itself; this is the outer shield.
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=token:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=addr:10m;

server {
    listen 80;
    server_name _;

    # Don't advertise nginx version in responses / error pages.
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers for the SPA.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    # Rely on same-origin /api; no inline-script exceptions beyond what Vite needs.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://accounts.google.com https://oauth2.googleapis.com https://www.googleapis.com wss://*.livekit.cloud https://*.livekit.cloud; frame-src https://accounts.google.com;" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Never serve hidden files (.git, .env) even if accidentally copied.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Internal API surface must never be reachable from the internet, even if
    # a future compose change proxies more paths. The voice/video workers talk
    # to the API over the compose network, not via nginx.
    location ~ ^/(internal|webhooks)(/|$) {
        deny all;
        return 404;
    }

    # FastAPI docs / schema must never leak publicly (prod disables them too).
    location ~ ^/(docs|redoc|openapi\.json)(/|$) {
        deny all;
        return 404;
    }
    location ~ ^/api/(docs|redoc|openapi\.json)(/|$) {
        deny all;
        return 404;
    }

    # Static assets are content-hashed by Vite — cache hard.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API proxy to the FastAPI service. Variable upstream forces per-request
    # DNS re-resolution (the `resolver` above).
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        limit_conn addr 50;
        # Brute-force shield on the auth endpoints specifically.
        location ~ ^/api/auth/(login|signup|google)(/|$) {
            limit_req zone=auth burst=10 nodelay;
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            client_max_body_size 1m;
        }
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 10m;
    }

    # LiveKit token endpoint lives at /token (legacy route used by the voice flow).
    # Authenticated in the API (student_id must match the Bearer token).
    location = /token {
        limit_req zone=token burst=5 nodelay;
        limit_conn addr 10;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 1m;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
