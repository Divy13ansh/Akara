# SPA + API proxy. Same-origin /api means zero CORS in composed mode (plan §3c).

# Resolve `api` at request time via Docker's embedded DNS (127.0.0.11) instead
# of caching its IP at startup — otherwise a recreated api container 502s.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Static assets are content-hashed by Vite — cache hard.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API proxy to the FastAPI service. Variable upstream forces per-request
    # DNS re-resolution (the `resolver` above).
    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 10m;
    }

    # LiveKit token endpoint lives at /token (legacy route used by the voice flow).
    location = /token {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
